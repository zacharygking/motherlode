[project]
name = "motherlode"
dynamic = ["version"]
description = "A data library for ML projects in two halves: the gate that validates a judge against blind human labels, and the engine that mines, pans and keeps the paydirt."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
api = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
motherlode = "motherlode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "motherlode.__version__"}

[tool.setuptools.packages.find]
include = ["motherlode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
